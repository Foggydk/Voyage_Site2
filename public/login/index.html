<link href="../assets/css/site.css" rel="stylesheet"/>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-lg">
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(0,0,0,0.05)] border border-outline-variant/10 overflow-hidden flex flex-col p-md md:p-lg">
<div class="flex flex-col items-center mb-lg text-center">
<div class="mb-sm"><a class="text-headline-md font-headline-md font-extrabold text-error hover:opacity-90 transition-opacity" href="../tours/">Вояж-Тур</a></div>
<h1 class="text-headline-md font-headline-md text-on-surface">Вход в личный кабинет</h1>
<p class="text-label-md font-label-md text-on-surface-variant mt-xs">С возвращением! Продолжите свое путешествие вместе с нами.</p>
</div>
<form id="auth-form" class="space-y-md">
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface ml-xs" for="email">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-error transition-colors">mail</span>
<input class="w-full h-12 pl-lg pr-md rounded-lg border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-error/20 focus:border-error outline-none transition-all text-body-md font-body-md" id="email" name="email" placeholder="example@voyage.ru" type="email" required autocomplete="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="text-label-md font-label-md text-on-surface" for="password">Пароль</label>
<button type="button" id="forgot" class="text-label-md font-label-md text-error hover:underline transition-all">Забыли пароль?</button>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-error transition-colors">lock</span>
<input class="w-full h-12 pl-lg pr-12 rounded-lg border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-error/20 focus:border-error outline-none transition-all text-body-md font-body-md" id="password" name="password" placeholder="••••••••" type="password" autocomplete="current-password" required minlength="6"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" id="toggle-pw" type="button" aria-label="Показать пароль">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div id="message" role="alert" hidden class="rounded-lg px-md py-sm text-label-md font-label-md"></div>
<button class="btn btn-primary w-full h-14 rounded-lg font-label-md text-label-md shadow-md" id="submit" type="submit">Войти</button>
</form>
<p id="demo-hint" hidden class="mt-md text-center text-caption font-caption text-on-surface-variant">Демо-режим: можно войти как <b>test@voyage.ru</b> / <b>password123</b> или создать свой аккаунт.</p>
<div class="mt-lg text-center">
<p class="text-label-md font-label-md text-on-surface-variant">Еще не зарегистрированы? <a class="text-error font-bold hover:underline ml-xs" href="../register/">Создать аккаунт</a></p>
</div>
</div>
</main>
<footer class="py-md text-center border-t border-outline-variant/10">
<p class="text-caption font-body-md text-on-surface-variant opacity-70">© 2026 Вояж-Тур. Все права защищены.</p>
</footer>
<style>[hidden] { display: none !important; }</style>
<script src="../assets/js/firebase-config.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
(function () {
  if (VoyageAuth.current()) { location.replace('../account/'); return; }
  var f = document.getElementById('auth-form');
  var box = document.getElementById('message');
  var submit = document.getElementById('submit');
  var label = submit.textContent;
  if (VoyageAuth.mode === 'demo') document.getElementById('demo-hint').hidden = false;

  function message(text, ok) {
    box.textContent = text;
    box.hidden = false;
    box.className = 'rounded-lg px-md py-sm text-label-md font-label-md ' +
      (ok ? 'bg-green-100 text-green-800' : 'bg-error-container text-on-error-container');
  }

  var pw = document.getElementById('password');
  document.getElementById('toggle-pw').addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.querySelector('span').textContent = show ? 'visibility_off' : 'visibility';
  });

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    box.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Подождите…';
    VoyageAuth.login(f.email.value, f.password.value).then(function () {
      location.href = '../account/';
    }).catch(function (err) {
      message(err.message, false);
      submit.disabled = false;
      submit.textContent = label;
    });
  });
  var forgot = document.getElementById('forgot');
  if (forgot) forgot.addEventListener('click', function () {
    VoyageAuth.resetPassword(f.email.value).then(function () {
      message('Письмо для сброса пароля отправлено на ' + f.email.value, true);
    }).catch(function (e) { message(e.message, false); });
  });
})();
</script>
<script src="../assets/js/cursor-glow.js"></script>
</body></html>
